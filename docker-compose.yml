services:
  sqlserver:
    image: mcr.microsoft.com/azure-sql-edge:latest
    container_name: iridium_test_sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in your environment}"
    ports:
      - "11433:1433"
    mem_limit: 512m
    restart: unless-stopped

  # iridium-server playground mode for testing with any SQL Server client
  iridium-playground:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:14330:1433"
    command: ["--playground", "--memory"]
    mem_limit: 256m
    restart: unless-stopped
    profiles:
      - playground
